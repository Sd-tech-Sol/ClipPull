name: Build ClipPull

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Read project version
        id: version
        shell: pwsh
        run: |
          [xml]$project = Get-Content 'src/ClipPull/ClipPull.csproj'
          $version = [string]$project.Project.PropertyGroup.Version
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw 'Project version is missing.'
          }
          "version=$($version.Trim())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Generate application icon
        shell: pwsh
        run: ./scripts/generate-icon.ps1

      - name: Restore
        run: dotnet restore src/ClipPull/ClipPull.csproj

      - name: Publish portable EXE
        shell: pwsh
        run: >-
          dotnet publish src/ClipPull/ClipPull.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=None
          -p:DebugSymbols=false
          -o dist

      - name: Verify single-file output
        shell: pwsh
        run: |
          if (-not (Test-Path 'dist/ClipPull.exe')) {
            throw 'dist/ClipPull.exe was not produced.'
          }

          $hash = (Get-FileHash 'dist/ClipPull.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  ClipPull.exe" | Set-Content 'dist/ClipPull.exe.sha256' -Encoding ascii
          Write-Host "ClipPull.exe SHA-256: $hash"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClipPull-win-x64-v${{ steps.version.outputs.version }}
          path: |
            dist/ClipPull.exe
            dist/ClipPull.exe.sha256
          if-no-files-found: error

      - name: Create versioned release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $tag = "v$version"

          gh release view $tag --repo '${{ github.repository }}' 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists; leaving it unchanged."
            exit 0
          }

          gh release create $tag `
            'dist/ClipPull.exe' `
            'dist/ClipPull.exe.sha256' `
            --repo '${{ github.repository }}' `
            --target '${{ github.sha }}' `
            --title "ClipPull $tag" `
            --notes 'Qualité vidéo, audio M4A/MP3, playlists limitées, glisser-déposer TXT, historique local, rapport d’erreurs copiable et aperçu titre/miniature.'
