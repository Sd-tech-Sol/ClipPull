name: Build ClipPull

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Read project version
        id: version
        shell: pwsh
        run: |
          [xml]$project = Get-Content 'src/ClipPull/ClipPull.csproj'
          $version = [string]$project.Project.PropertyGroup.Version
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw 'Project version is missing.'
          }
          "version=$($version.Trim())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Generate application icon
        shell: pwsh
        run: ./scripts/generate-icon.ps1

      - name: Restore
        run: dotnet restore tests/ClipPull.Tests/ClipPull.Tests.csproj

      - name: Test
        run: dotnet test tests/ClipPull.Tests/ClipPull.Tests.csproj -c Release --no-restore --filter "Category!=RealMedia"

      - name: Publish portable EXE
        shell: pwsh
        run: >-
          dotnet publish src/ClipPull/ClipPull.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=None
          -p:DebugSymbols=false
          -o dist

      - name: Verify single-file output
        shell: pwsh
        run: |
          if (-not (Test-Path 'dist/ClipPull.exe')) {
            throw 'dist/ClipPull.exe was not produced.'
          }

      - name: Detect Artifact Signing configuration
        id: signing
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          ARTIFACT_SIGNING_ENDPOINT: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          ARTIFACT_SIGNING_ACCOUNT_NAME: ${{ vars.ARTIFACT_SIGNING_ACCOUNT_NAME }}
          ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ vars.ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME }}
        run: |
          $values = @(
            $env:AZURE_CLIENT_ID,
            $env:AZURE_TENANT_ID,
            $env:AZURE_SUBSCRIPTION_ID,
            $env:ARTIFACT_SIGNING_ENDPOINT,
            $env:ARTIFACT_SIGNING_ACCOUNT_NAME,
            $env:ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME
          )
          $configured = @($values | Where-Object { -not [string]::IsNullOrWhiteSpace($_) }).Count

          if ($configured -eq 0) {
            'enabled=false' | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Write-Warning 'Artifact Signing is not configured. This build will remain unsigned.'
            exit 0
          }

          if ($configured -ne $values.Count) {
            throw 'Artifact Signing is only partially configured. Define all six repository variables before publishing.'
          }

          'enabled=true' | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Azure login with GitHub OIDC
        if: steps.signing.outputs.enabled == 'true' && github.event_name != 'pull_request'
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Sign ClipPull.exe with Microsoft Artifact Signing
        if: steps.signing.outputs.enabled == 'true' && github.event_name != 'pull_request'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME }}
          files: ${{ github.workspace }}\dist\ClipPull.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: ClipPull portable Windows media downloader
          description-url: https://github.com/Sd-tech-Sol/ClipPull

      - name: Verify Authenticode signature
        if: steps.signing.outputs.enabled == 'true' && github.event_name != 'pull_request'
        shell: pwsh
        run: |
          $signature = Get-AuthenticodeSignature 'dist/ClipPull.exe'
          $signature | Format-List Status, StatusMessage, SignerCertificate, TimeStamperCertificate
          if ($signature.Status -ne 'Valid') {
            throw "Authenticode signature verification failed: $($signature.Status) - $($signature.StatusMessage)"
          }
          Write-Host "Valid Authenticode signature: $($signature.SignerCertificate.Subject)"

      - name: Calculate final SHA-256
        shell: pwsh
        run: |
          $hash = (Get-FileHash 'dist/ClipPull.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  ClipPull.exe" | Set-Content 'dist/ClipPull.exe.sha256' -Encoding ascii
          Write-Host "ClipPull.exe SHA-256: $hash"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClipPull-win-x64-v${{ steps.version.outputs.version }}
          path: |
            dist/ClipPull.exe
            dist/ClipPull.exe.sha256
          if-no-files-found: error

      - name: Create or refresh versioned release
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED: ${{ steps.signing.outputs.enabled }}
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $tag = "v$version"
          if ($env:SIGNED -eq 'true') {
            $signingText = '**Signing:** This executable is Authenticode signed with Microsoft Artifact Signing.'
          } else {
            $signingText = '**Signing:** This executable is unsigned. Microsoft Artifact Signing is not configured for this release.'
          }
          $notesPath = "docs/releases/$tag.md"
          if (-not (Test-Path -LiteralPath $notesPath)) {
            throw "Release notes are missing: $notesPath"
          }
          $notesOutput = 'dist/release-notes.md'
          (Get-Content -LiteralPath $notesPath -Raw).Replace('{{SIGNING_STATUS}}', $signingText) |
            Set-Content -LiteralPath $notesOutput -Encoding utf8

          gh release view $tag --repo '${{ github.repository }}' 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag `
              'dist/ClipPull.exe' `
              'dist/ClipPull.exe.sha256' `
              --clobber `
              --repo '${{ github.repository }}'
            gh release edit $tag `
              --repo '${{ github.repository }}' `
              --target '${{ github.sha }}' `
              --title "ClipPull $tag" `
              --notes-file $notesOutput
            exit 0
          }

          gh release create $tag `
            'dist/ClipPull.exe' `
            'dist/ClipPull.exe.sha256' `
            --repo '${{ github.repository }}' `
            --target '${{ github.sha }}' `
            --title "ClipPull $tag" `
            --notes-file $notesOutput
